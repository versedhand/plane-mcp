# Publish @versedhand/plane-mcp to npm via Trusted Publishing (OIDC). No npm token lives in this repo.
# Added 2026-11-25 (INF-293): npm revokes 2FA-bypass publish tokens in January 2027.
#
# Release: bump package.json (`npm version patch`), then `git push --follow-tags`. A tag vX.Y.Z triggers this.
# npmjs.com -> @versedhand/plane-mcp -> Settings -> Trusted Publisher must name versedhand/plane-mcp and the
# workflow filename `publish.yml` exactly; renaming this file breaks publishing until that entry is redone.
name: publish
on:
  push:
    tags: ['v*']

permissions:
  id-token: write # OIDC token for npm trusted publishing and the provenance attestation
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires GitHub-hosted runners
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds
      - name: Tag must equal package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $want"; exit 1; }
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)' "$(npm --version)" \
            || npm install -g npm@11
          npm --version
      - run: npm ci
      # prepublishOnly runs the build and the live SQL suite against a throwaway Postgres in docker.
      - run: npm publish --provenance --access public
